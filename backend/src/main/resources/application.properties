# ===== Server Configuration =====
# Railway injects PORT automatically; fallback to 9191 locally
server.port=${PORT:9191}

# ===== Application Info =====
spring.application.name=insurance-portal-backend

# ===== PostgreSQL Database Configuration =====
# Set these as Environment Variables in Railway dashboard:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate Configuration =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ===== JWT Configuration =====
# Set JWT_SECRET as an Environment Variable in Railway dashboard
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Logging =====
logging.level.com.insuranceportal=INFO
logging.level.org.springframework.security=WARN