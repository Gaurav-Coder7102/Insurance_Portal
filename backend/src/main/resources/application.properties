# ===== Server Configuration =====
server.port=9191

# ===== Application Info =====
spring.application.name=insurance-portal-backend

# ===== PostgreSQL Database Configuration =====
# TODO: Update username, password, and database name before running
spring.datasource.url=jdbc:postgresql://localhost:5432/insurance_portal_db
spring.datasource.username=postgres
# IMPORTANT: Do NOT put your real password here — this file is committed to Git!
# Create src/main/resources/application-local.properties (gitignored) with:
#   spring.datasource.password=your_actual_password
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate Configuration =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT Configuration =====
# Secret key (Base64-encoded, min 256-bit for HS256)
# TODO: Replace with a strong secret in production (use env variable)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ===== Logging =====
logging.level.com.insuranceportal=DEBUG
logging.level.org.springframework.security=DEBUG
